name: Verify demo logic
on:
  push:
    branches: [application-prep, main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run domain and SQLite tests
        run: npm test
      - run: npm run evaluate
