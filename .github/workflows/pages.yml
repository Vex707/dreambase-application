name: Publish reviewed portfolio
# Publish reviewed site changes and allow a manual redeployment.
on:
  workflow_dispatch:
  push:
    branches: [application-prep, main]
    paths: ['site/**', '.github/workflows/pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify domain logic
        run: npm test
      - run: npm run evaluate
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish only the public site directory
        id: deployment
        uses: actions/deploy-pages@v4
